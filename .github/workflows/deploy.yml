name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # deploy-pages looks the artifact up once with no retry; give the
      # artifact listing a moment to catch up after the upload finalizes
      - name: Wait for artifact to register
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
